name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # sem a IA (ultralytics/torch): os testes usam uma IA de mentira
      - run: pip install numpy opencv-python-headless pyyaml pillow fpdf2 pytest
      - run: python -m pytest -q tests
