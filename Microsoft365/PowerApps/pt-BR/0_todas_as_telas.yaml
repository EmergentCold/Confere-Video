        =If(IsBlank(varPeriodo); Set(varPeriodo; 7));; Select(pnlAtualizar)
    Children:
      - pnlTopo:
          Control: Rectangle
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =132
            Fill: |-
              =RGBA(22; 32; 46; 1)
