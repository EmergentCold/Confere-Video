      - pnlSub:
          Control: Label
          Properties:
            Text: |-
              =If(varPeriodo = 1; "Hoje"; "Últimos " & varPeriodo & " dias") & If(varDemo; " · com demonstração"; "")
            X: =32
            Y: =88
            Width: =560
            Height: =30
            Size: =12
            Color: |-
              =RGBA(201; 213; 227; 1)
      - pnlAtualizar:
          Control: Classic/Button
          Properties:
            Text: |-
              ="Atualizar"
            X: =0
            Y: =0
            Width: =10
            Height: =10
            OnSelect: |-
              =ClearCollect(colTurnos; Filter(ConfereVideo_Turnos; Inicio >= DateAdd(Today(); 1 - varPeriodo; TimeUnit.Days); (varDemo || Origem <> "Demonstração")));;
              ClearCollect(colPendentes; Filter(ConfereVideo_Erros; Status = "Pendente"; (varDemo || Origem <> "Demonstração")));;
              Set(varConfirmados; CountRows(Filter(ConfereVideo_Erros; DataHora >= DateAdd(Today(); 1 - varPeriodo; TimeUnit.Days); Status = "Confirmado"; (varDemo || Origem <> "Demonstração"))));;
              Set(varFalsos; CountRows(Filter(ConfereVideo_Erros; DataHora >= DateAdd(Today(); 1 - varPeriodo; TimeUnit.Days); Status = "Falso alarme"; (varDemo || Origem <> "Demonstração"))));;
              Set(varTipos; Table(
                  {Nome: "Sem passar no leitor"; Qtd: Sum(colTurnos; SemLeitor); Cor: RGBA(194; 65; 12; 1)};
                  {Nome: "Colocou em outra caixa"; Qtd: Sum(colTurnos; CaixaErrada); Cor: RGBA(124; 58; 237; 1)};
                  {Nome: "Passou no leitor sem bipar"; Qtd: Sum(colTurnos; SemBipe); Cor: RGBA(14; 116; 144; 1)};
                  {Nome: "Bipe duplo"; Qtd: Sum(colTurnos; BipeDuplo); Cor: RGBA(185; 28; 28; 1)}
              ))
            Fill: |-
              =RGBA(15; 76; 129; 1)
            Color: |-
              =RGBA(255; 255; 255; 1)
            Size: =13
            FontWeight: =FontWeight.Semibold
            BorderThickness: =0
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            HoverFill: |-
              =ColorFade(Self.Fill; -15%)
            PressedFill: |-
              =ColorFade(Self.Fill; -25%)
            HoverColor: =Self.Color
            PressedColor: =Self.Color
            Visible: =false
      - pnlPeriodo1:
