- trtSalvar:
    Control: Classic/Button
    Properties:
      Text: |-
        ="Salvar tratativa"
      X: =32
      Y: =1028
      Width: =576
      Height: =64
      OnSelect: |-
        =Patch(ConfereVideo_Erros; varErro; {Status: locStatus; Tratativa: If(locStatus = "Confirmado"; locTrat; ""); Operador: trtOperador.Text; Observacao: trtObs.Text; TratadoPor: User().FullName; TratadoEm: Now()});;
        If(IsEmpty(Errors(ConfereVideo_Erros)); Notify("Tratativa salva."; NotificationType.Success);; Back(); Notify("Não consegui salvar: " & First(Errors(ConfereVideo_Erros)).Message; NotificationType.Error))
      Fill: |-
        =RGBA(21; 128; 61; 1)
      Color: |-
        =RGBA(255; 255; 255; 1)
      Size: =15
      FontWeight: =FontWeight.Semibold
      BorderThickness: =0
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      HoverFill: |-
        =ColorFade(Self.Fill; -15%)
      PressedFill: |-
        =ColorFade(Self.Fill; -25%)
      HoverColor: =Self.Color
      PressedColor: =Self.Color
      DisplayMode: |-
        =If(IsBlank(locStatus) || (locStatus = "Confirmado" && IsBlank(locTrat)); DisplayMode.Disabled; DisplayMode.Edit)
      DisabledFill: |-
        =RGBA(167; 201; 179; 1)
      DisabledColor: |-
        =RGBA(255; 255; 255; 1)
