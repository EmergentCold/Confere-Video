      - pnlGaleriaTipos:
          Control: Gallery
          Variant: galleryVertical
          Properties:
            Items: =varTipos
            X: =32
            Y: =510
            Width: =576
            Height: =236
            TemplateSize: =58
            TemplatePadding: =0
            OnSelect: =false
            ShowScrollbar: =false
            Fill: |-
              =RGBA(0; 0; 0; 0)
          Children:
            - pnlTipoNome:
                Control: Label
                Properties:
                  Text: =ThisItem.Nome
                  X: =0
                  Y: =0
                  Width: =420
                  Height: =30
                  Size: =12
                  Color: |-
                    =RGBA(22; 32; 46; 1)
            - pnlTipoQtd:
                Control: Label
                Properties:
                  Text: =ThisItem.Qtd
                  X: =476
                  Y: =0
                  Width: =100
                  Height: =30
                  Size: =12
                  Color: |-
                    =RGBA(22; 32; 46; 1)
                  FontWeight: =FontWeight.Bold
                  Align: =Align.Right
            - pnlTipoFundo:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =34
                  Width: =576
                  Height: =10
                  Fill: |-
                    =RGBA(238; 241; 245; 1)
            - pnlTipoBarra:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =34
                  Width: |-
                    =576 * ThisItem.Qtd / Max(1; Max(varTipos; Qtd))
                  Height: =10
                  Fill: =ThisItem.Cor
