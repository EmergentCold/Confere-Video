Screens:
  scrPainel:
    Properties:
      Fill: |-
        =RGBA(244; 246; 249; 1)
      OnVisible: |-
        =If(IsBlank(varPeriodo); Set(varPeriodo; 7));; Select(pnlAtualizar)
    Children:
      - pnlTopo:
          Control: Rectangle
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =132
            Fill: |-
              =RGBA(22; 32; 46; 1)
      - pnlMarca:
          Control: Label
          Properties:
            Text: |-
              ="CONFEREVÍDEO · TRATATIVAS"
            X: =32
            Y: =22
            Width: =520
            Height: =26
            Size: =10
            Color: |-
              =RGBA(159; 179; 204; 1)
            FontWeight: =FontWeight.Semibold
      - pnlTitulo:
          Control: Label
          Properties:
            Text: |-
              ="Painel da conferência"
            X: =32
            Y: =46
            Width: =560
            Height: =44
            Size: =22
            Color: |-
              =RGBA(255; 255; 255; 1)
            FontWeight: =FontWeight.Bold
      - pnlSub:
          Control: Label
          Properties:
            Text: |-
              =If(varPeriodo = 1; "Hoje"; "Últimos " & varPeriodo & " dias") & If(varDemo; " · com demonstração"; "")
            X: =32
            Y: =88
            Width: =560
            Height: =30
            Size: =12
            Color: |-
              =RGBA(201; 213; 227; 1)
      - pnlAtualizar:
          Control: Classic/Button
          Properties:
            Text: |-
              ="Atualizar"
            X: =0
            Y: =0
            Width: =10
            Height: =10
            OnSelect: |-
              =ClearCollect(colTurnos; Filter(ConfereVideo_Turnos; Inicio >= DateAdd(Today(); 1 - varPeriodo; TimeUnit.Days); (varDemo || Origem <> "Demonstração")));;
              ClearCollect(colPendentes; Filter(ConfereVideo_Erros; Status = "Pendente"; (varDemo || Origem <> "Demonstração")));;
              Set(varConfirmados; CountRows(Filter(ConfereVideo_Erros; DataHora >= DateAdd(Today(); 1 - varPeriodo; TimeUnit.Days); Status = "Confirmado"; (varDemo || Origem <> "Demonstração"))));;
              Set(varFalsos; CountRows(Filter(ConfereVideo_Erros; DataHora >= DateAdd(Today(); 1 - varPeriodo; TimeUnit.Days); Status = "Falso alarme"; (varDemo || Origem <> "Demonstração"))));;
              Set(varTipos; Table(
                  {Nome: "Sem passar no leitor"; Qtd: Sum(colTurnos; SemLeitor); Cor: RGBA(194; 65; 12; 1)};
                  {Nome: "Colocou em outra caixa"; Qtd: Sum(colTurnos; CaixaErrada); Cor: RGBA(124; 58; 237; 1)};
                  {Nome: "Passou no leitor sem bipar"; Qtd: Sum(colTurnos; SemBipe); Cor: RGBA(14; 116; 144; 1)};
                  {Nome: "Bipe duplo"; Qtd: Sum(colTurnos; BipeDuplo); Cor: RGBA(185; 28; 28; 1)}
              ))
            Fill: |-
              =RGBA(15; 76; 129; 1)
            Color: |-
              =RGBA(255; 255; 255; 1)
            Size: =13
            FontWeight: =FontWeight.Semibold
            BorderThickness: =0
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            HoverFill: |-
              =ColorFade(Self.Fill; -15%)
            PressedFill: |-
              =ColorFade(Self.Fill; -25%)
            HoverColor: =Self.Color
            PressedColor: =Self.Color
            Visible: =false
      - pnlPeriodo1:
          Control: Classic/Button
          Properties:
            Text: |-
              ="Hoje"
            X: =32
            Y: =152
            Width: =140
            Height: =44
            OnSelect: |-
              =Set(varPeriodo; 1);; Select(pnlAtualizar)
            Fill: |-
              =If(varPeriodo = 1; RGBA(15; 76; 129; 1); RGBA(255; 255; 255; 1))
            Color: |-
              =If(varPeriodo = 1; RGBA(255; 255; 255; 1); RGBA(22; 32; 46; 1))
            Size: =11
            FontWeight: =FontWeight.Semibold
            BorderThickness: =1
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            HoverFill: |-
              =ColorFade(Self.Fill; -15%)
            PressedFill: |-
              =ColorFade(Self.Fill; -25%)
            HoverColor: =Self.Color
            PressedColor: =Self.Color
            BorderColor: |-
              =RGBA(227; 231; 238; 1)
      - pnlPeriodo7:
          Control: Classic/Button
          Properties:
            Text: |-
              ="7 dias"
            X: =184
            Y: =152
            Width: =140
            Height: =44
            OnSelect: |-
              =Set(varPeriodo; 7);; Select(pnlAtualizar)
            Fill: |-
              =If(varPeriodo = 7; RGBA(15; 76; 129; 1); RGBA(255; 255; 255; 1))
            Color: |-
