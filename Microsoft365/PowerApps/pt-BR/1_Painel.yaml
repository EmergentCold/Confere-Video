            PressedFill: |-
              =ColorFade(Self.Fill; -25%)
            HoverColor: =Self.Color
            PressedColor: =Self.Color
            BorderColor: |-
              =RGBA(227; 231; 238; 1)
      - pnlPeriodo30:
          Control: Classic/Button
          Properties:
            Text: |-
              ="30 dias"
            X: =336
            Y: =152
            Width: =140
            Height: =44
            OnSelect: |-
              =Set(varPeriodo; 30);; Select(pnlAtualizar)
            Fill: |-
              =If(varPeriodo = 30; RGBA(15; 76; 129; 1); RGBA(255; 255; 255; 1))
            Color: |-
