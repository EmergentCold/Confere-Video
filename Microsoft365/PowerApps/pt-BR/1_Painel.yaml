            PressedFill: |-
              =ColorFade(Self.Fill; -25%)
            HoverColor: =Self.Color
            PressedColor: =Self.Color
            BorderColor: |-
              =RGBA(227; 231; 238; 1)
      - pnlDemo:
          Control: Classic/Button
          Properties:
            Text: |-
              ="Demonstração"
            X: =488
            Y: =152
            Width: =120
            Height: =44
            OnSelect: |-
              =Set(varDemo; !varDemo);; Select(pnlAtualizar)
            Fill: |-
              =If(varDemo; RGBA(15; 76; 129; 1); RGBA(255; 255; 255; 1))
            Color: |-
              =If(varDemo; RGBA(255; 255; 255; 1); RGBA(22; 32; 46; 1))
            Size: =11
            FontWeight: =FontWeight.Semibold
            BorderThickness: =1
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
