            Size: =11
            FontWeight: =FontWeight.Semibold
            BorderThickness: =1
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            HoverFill: |-
