- errGaleria:
    Control: Gallery
    Variant: galleryVertical
    Properties:
      Items: |-
        =If(varStatus = "Pendente",
            Sort(Filter(ConfereVideo_Erros, Status = "Pendente", (varDemo || Origem <> "Demonstração")), DataHora, SortOrder.Descending),
            Sort(Filter(ConfereVideo_Erros, DataHora >= DateAdd(Today(), -60, TimeUnit.Days), varStatus = "Todos" || Status = varStatus, (varDemo || Origem <> "Demonstração")), DataHora, SortOrder.Descending)
        )
      X: =32
      Y: =208
      Width: =576
      Height: =908
      TemplateSize: =162
      TemplatePadding: =0
      OnSelect: |-
        =Set(varErro, ThisItem); Navigate(scrTratativa, ScreenTransition.Cover)
      ShowScrollbar: =false
      Fill: |-
        =RGBA(0, 0, 0, 0)
    Children:
      - errCartao:
          Control: Rectangle
          Properties:
            X: =0
            Y: =0
            Width: =576
            Height: =150
            Fill: |-
              =RGBA(255, 255, 255, 1)
            BorderColor: |-
              =RGBA(227, 231, 238, 1)
            BorderThickness: =1
      - errFoto:
          Control: Image
          Properties:
            Image: =ThisItem.Miniatura
            X: =12
            Y: =12
            Width: =200
            Height: =126
            ImagePosition: =ImagePosition.Fit
            Fill: |-
              =RGBA(11, 16, 24, 1)
      - errFaixa:
          Control: Rectangle
          Properties:
            X: =226
            Y: =18
            Width: =6
            Height: =50
            Fill: |-
              =Switch(ThisItem.Status, "Confirmado", RGBA(185, 28, 28, 1), "Falso alarme", RGBA(91, 102, 120, 1), RGBA(194, 65, 12, 1))
      - errTipo:
          Control: Label
          Properties:
            Text: =ThisItem.Tipo
            X: =242
            Y: =12
            Width: =300
            Height: =34
            Size: =14
            Color: |-
              =RGBA(22, 32, 46, 1)
            FontWeight: =FontWeight.Bold
      - errQuando:
          Control: Label
          Properties:
            Text: |-
              =Text(ThisItem.DataHora, "dd/mm/yyyy hh:mm:ss")
            X: =242
            Y: =46
            Width: =300
            Height: =26
            Size: =11
            Color: |-
              =RGBA(91, 102, 120, 1)
      - errPosto:
          Control: Label
          Properties:
            Text: |-
              =ThisItem.Posto & If(IsBlank(ThisItem.Turno), "", " · " & ThisItem.Turno)
            X: =242
            Y: =72
            Width: =300
            Height: =26
            Size: =11
            Color: |-
              =RGBA(91, 102, 120, 1)
      - errStatus:
          Control: Label
          Properties:
            Text: =ThisItem.Status
            X: =242
            Y: =104
            Width: =150
            Height: =30
            Size: =11
            Color: |-
              =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Semibold
            Align: =Align.Center
            Fill: |-
              =Switch(ThisItem.Status, "Confirmado", RGBA(185, 28, 28, 1), "Falso alarme", RGBA(91, 102, 120, 1), RGBA(194, 65, 12, 1))
      - errSeta:
          Control: Classic/Icon
          Variant: ChevronRight
          Properties:
            Icon: =Icon.ChevronRight
            X: =528
            Y: =50
            Width: =44
            Height: =50
            OnSelect: =Select(Parent)
            Color: |-
              =RGBA(91, 102, 120, 1)
            PaddingTop: =8
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            AccessibleLabel: |-
              ="Abrir"
